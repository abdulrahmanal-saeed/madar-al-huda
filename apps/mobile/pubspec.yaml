name: madar_al_huda
description: "Madar Al-Huda (مدار الهدى) — a free, bilingual Islamic companion."
publish_to: 'none'

# versionName+versionCode. Bump per release; see plan/PHASE_06_RELEASE.md.
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

# Dependencies are pinned to exact versions (see plan/DECISIONS.md, D-12).
# pubspec.lock is committed. Upgrade deliberately, in a dedicated PR.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  intl: 0.20.3
  adhan_dart: 2.0.1
  crypto: 3.0.8
  geolocator: 14.1.2
  http: 1.6.0
  just_audio: 0.10.6
  just_audio_background: 0.0.1-beta.17
  scrollable_positioned_list: 0.3.8
  timezone: 0.11.2
  url_launcher: 6.3.3
  xml: 6.6.1
  material_ui: 1.11.1
  path_provider: 2.1.6
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  shared_preferences_platform_interface: 2.4.2

flutter:
  uses-material-design: true
  # Generates lib/core/localization/generated/ from the ARB files (l10n.yaml).
  generate: true

  # Bundled typefaces and accompanying SIL OFL notices.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700

    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/amiri_quran/AmiriQuran.ttf
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/reem_kufi/ReemKufi.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri/Amiri-Regular.ttf

  assets:
    - assets/adhkar/catalog.json
    - assets/fonts/amiri/OFL.txt
    - assets/fonts/amiri_quran/OFL.txt
    - assets/fonts/reem_kufi/OFL.txt
    - assets/location/countries.json
    - assets/quran/uthmani.txt
    - assets/quran/metadata.xml
    - assets/fonts/ibm_plex_sans_arabic/OFL.txt
