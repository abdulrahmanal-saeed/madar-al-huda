<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>مدار الهدى</title>
  <style>
    :root { color-scheme: light dark; --bg: #F5F0E6; --ink: #12332F; --card: #FFFDF8; --gold: #B8893A; --green: #0F4A43; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0D1917; --ink: #ECE6D8; --card: #13221F; --gold: #D9BE85; --green: #9CCFC1; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px/1.8 system-ui, "Segoe UI", Tahoma, sans-serif; }
    main { max-width: 26rem; margin: 1rem; padding: 2rem 1.5rem; border-radius: 1.5rem; background: var(--card); text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h1 { margin: 0 0 .25rem; color: var(--green); font-size: 1.8rem; }
    p { margin: .5rem 0 1.25rem; }
    a.button { display: block; padding: .8rem 1rem; border-radius: 999px; background: #0F4A43; color: #F5F0E6; text-decoration: none; font-weight: 600; }
    small { display: block; margin-top: 1rem; color: var(--gold); }
  </style>
</head>
<body>
  <main>
    <h1>مدار الهدى</h1>
    <p>هذا الرابط يُفتح داخل تطبيق «مدار الهدى». إن لم يكن التطبيق مثبتًا على جهازك، حمّله ثم افتح الرابط مرة أخرى.</p>
    <a class="button" href="/admin/?updates=dev">تحميل التطبيق</a>
    <small lang="en" dir="ltr">This link opens in the Madar Al-Huda app.</small>
  </main>
</body>
</html>
