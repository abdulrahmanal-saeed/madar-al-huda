# Dev distribution channel (task P00-11, decision D-17).
#
# After "Mobile CI" passes on main, build a release APK signed with the fixed
# DEV key and publish it as a GitHub *prerelease*. Testers install Obtainium
# once and receive every new build automatically (docs/DEV_UPDATES.md).
#
# It does not repeat any CI check: it runs only after Mobile CI succeeded
# for the same commit. The store release (Play signing) is P06-01.
name: Dev release

on:
  workflow_run:
    workflows: [Mobile CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.50.0'
  KEEP_RELEASES: '10'

jobs:
  publish:
    name: Build & publish dev APK
    # Only after a successful CI run triggered by a push to main
    # (never for pull requests), or when started manually.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    env:
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require signing secrets
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.MADAR_DEV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MADAR_DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MADAR_DEV_KEY_ALIAS }}
        run: |
          missing=0
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::Add MADAR_DEV_KEYSTORE_BASE64, MADAR_DEV_KEYSTORE_PASSWORD and MADAR_DEV_KEY_ALIAS in Settings → Secrets and variables → Actions (docs/DEV_UPDATES.md)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Compute version
        id: version
        run: |
          base=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          build=${{ github.run_number }}
          echo "name=${base}-dev.${build}" >> "$GITHUB_OUTPUT"
          echo "code=${build}" >> "$GITHUB_OUTPUT"
          echo "suffix=-dev.${build}" >> "$GITHUB_OUTPUT"

      - name: Decode dev keystore
        env:
          KEYSTORE_B64: ${{ secrets.MADAR_DEV_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/madar-dev.p12"

      - name: Install dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Build signed dev APK
        env:
          MADAR_CHANNEL: dev
          MADAR_QURAN_API_URL: ${{ vars.MADAR_QURAN_API_URL }}
          MADAR_SUPABASE_ANON_KEY: ${{ vars.MADAR_SUPABASE_ANON_KEY }}
          MADAR_VERSION_SUFFIX: ${{ steps.version.outputs.suffix }}
          MADAR_SIGNING_STORE_FILE: ${{ runner.temp }}/madar-dev.p12
          MADAR_SIGNING_STORE_PASSWORD: ${{ secrets.MADAR_DEV_KEYSTORE_PASSWORD }}
          MADAR_SIGNING_KEY_ALIAS: ${{ secrets.MADAR_DEV_KEY_ALIAS }}
          MADAR_SIGNING_KEY_PASSWORD: ${{ secrets.MADAR_DEV_KEYSTORE_PASSWORD }}
        run: |
          build_args=(--release --dart-define=MADAR_MANAGED_RELEASE=true "--dart-define=MADAR_BUILD=${{ steps.version.outputs.code }}" "--build-number=${{ steps.version.outputs.code }}")
          if [[ -n "$MADAR_QURAN_API_URL" || -n "$MADAR_SUPABASE_ANON_KEY" ]]; then
            config="$RUNNER_TEMP/madar-public-config.json"
            python3 tool/write_quran_config.py "$config"
            build_args+=(--dart-define-from-file="$config")
          fi
          flutter build apk "${build_args[@]}"

      - name: Verify package, version and signature
        id: verify
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          badging=$("$bt/aapt2" dump badging "$apk")
          echo "$badging" | grep -E "^package|uses-permission"
          echo "$badging" | grep -q "name='com.abdulrahmanalsaeed.madaralhuda.dev'"
          echo "$badging" | grep -q "versionCode='${{ steps.version.outputs.code }}'"
          echo "$badging" | grep -q "versionName='${{ steps.version.outputs.name }}'"
          cert=$("$bt/apksigner" verify --print-certs "$apk" | sed -nE 's/.*certificate SHA-256 digest: //p' | head -1)
          test "$cert" = 6c7046d0f47791452da955c39b1710addd2fa042373c29782e692a08042f3ee3
          out="madar-al-huda-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$RUNNER_TEMP/$out"
          echo "file=$RUNNER_TEMP/$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cert=$cert" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Development build of Madar Al-Huda (مدار الهدى) — **not a store release**.
          Religious content is still gated; see plan/TRACKER.md.

          - Commit: ${COMMIT_SHA}
          - App ID: \`com.abdulrahmanalsaeed.madaralhuda.dev\`
          - APK SHA-256: \`${{ steps.verify.outputs.sha256 }}\`
          - Signing certificate SHA-256: \`${{ steps.verify.outputs.cert }}\`

          Auto-update with Obtainium: docs/DEV_UPDATES.md
          EOF
          gh release create "$TAG" "${{ steps.verify.outputs.file }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "Dev build ${{ steps.version.outputs.name }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease

      - name: Publish to the app's update channel
        # Sends the same verified APK to the admin, which checks the signer
        # and build number again before offering it to installed apps.
        env:
          ADMIN_TOKEN: ${{ secrets.MADAR_ADMIN_RELEASE_TOKEN }}
          APK: ${{ steps.verify.outputs.file }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          if [[ -z "$ADMIN_TOKEN" ]]; then
            echo "MADAR_ADMIN_RELEASE_TOKEN is not set; skipping."
            exit 0
          fi
          subject=$(git log -1 --format=%s "$COMMIT_SHA" 2>/dev/null || true)
          notes=$(SUBJECT="$subject" python3 -c 'import base64, json, os; print(base64.b64encode(json.dumps({"ar": "تحديث تجريبي جديد من مدار الهدى.", "en": os.environ["SUBJECT"] or "New development build."}).encode()).decode())')
          status=$(curl -sS --retry 3 --max-time 600 -o "$RUNNER_TEMP/admin.json" -w '%{http_code}' \
            -X POST "https://quran.abdulrahmanalsaeed.com/admin/?ci=release" \
            -H "X-Madar-Token: $ADMIN_TOKEN" \
            -H "X-Release-Code: $CODE" \
            -H "X-Release-Name: $NAME" \
            -H "X-Release-Notes: $notes" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK")
          cat "$RUNNER_TEMP/admin.json"; echo
          # 409: this build (or a newer one) is already on the channel.
          [[ "$status" == 201 || "$status" == 409 ]]

      - name: Keep only the newest dev releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$' |
            tail -n +$((KEEP_RELEASES + 1)) |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/madar-dev.p12"
