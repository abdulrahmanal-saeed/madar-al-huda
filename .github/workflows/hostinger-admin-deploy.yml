# Operations-only branch. Never merge this workflow into main.
name: Hostinger private fiqh staging rehearsal

on:
  push:
    branches: [ops/fiqh-staging-rehearsal]
    paths:
      - '.github/workflows/hostinger-admin-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madar-hostinger-admin-production
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.ref == 'refs/heads/ops/fiqh-staging-rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare tested staging-only code
        shell: bash
        run: |
          set -euo pipefail
          php -l hosting/fiqh-stage.php
          php hosting/tests/fiqh_stage_test.php
          tar -czf "$RUNNER_TEMP/fiqh-stage.tar.gz" hosting/fiqh-stage.php hosting/admin/fiqh-model.php hosting/admin/fiqh-storage.php hosting/admin/fiqh-metadata.php hosting/admin/fiqh-review.php docs/content/fiqh/seed.json
      - name: Rehearse on private Hostinger snapshot (no deployment)
        shell: bash
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing HOSTINGER_SSH_HOST}" "${USER:?Missing HOSTINGER_SSH_USER}" "${KEY:?Missing HOSTINGER_SSH_KEY}"
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ && "$USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          umask 077
          key="$RUNNER_TEMP/fiqh-ssh-key"
          known="$RUNNER_TEMP/fiqh-known-hosts"
          printf '%s\n' "$KEY" | tr -d '\r' > "$key"
          unset KEY
          chmod 600 "$key"
          trap 'rm -f "$key" "$known"' EXIT
          ssh-keyscan -T 15 -p 65002 -t ed25519 "$HOST" > "$known"
          fingerprint=$(ssh-keygen -E sha256 -lf "$known" | awk '{print $2}' | sort -u)
          test "$fingerprint" = 'SHA256:4bu/oKsT8DDL7MCC81qLK+ZdKYS8XFne24v/qd13dfs'
          opts=(-i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=15)
          target="$USER@$HOST"
          stage=$(ssh "${opts[@]}" -p 65002 "$target" 'umask 077; mktemp -d "$HOME/.madar-fiqh-stage.XXXXXX"')
          [[ "$stage" =~ ^/home/[a-zA-Z0-9_-]+/\.madar-fiqh-stage\.[a-zA-Z0-9]+$ ]]
          cleanup() {
            ssh "${opts[@]}" -p 65002 "$target" "rm -rf -- '$stage'" >/dev/null 2>&1 || true
            rm -f "$key" "$known"
          }
          trap cleanup EXIT
          scp "${opts[@]}" -P 65002 "$RUNNER_TEMP/fiqh-stage.tar.gz" "$target:$stage/code.tar.gz"
          ssh "${opts[@]}" -p 65002 "$target" bash -s -- "$stage" <<'REMOTE'
          set -euo pipefail
          umask 077
          stage="$1"
          root="$HOME/domains/quran.abdulrahmanalsaeed.com"
          private="$root/.madar-admin"
          source="$private/library.sqlite3"
          [[ -d "$private" && ! -L "$private" && -f "$source" && ! -L "$source" ]]
          [[ ! -L "$private/backups" ]]
          mkdir -p "$private/backups"
          [[ -d "$private/backups" && ! -L "$private/backups" ]]
          mkdir "$stage/code"
          tar -xzf "$stage/code.tar.gz" -C "$stage/code"
          suffix=${stage##*.}
          destination="$private/backups/fiqh-rehearsal-$suffix"
          php "$stage/code/hosting/fiqh-stage.php" "$source" "$destination" > "$stage/result.json"
          # Only aggregate pass/fail and counts reach GitHub. Both database copies
          # and the complete checksum report remain in private Hostinger storage.
          php -r '$r=json_decode(file_get_contents($argv[1]),true,64,JSON_THROW_ON_ERROR); if (($r["status"]??null)!=="passed" || $r["sourceMigrated"]!==false || $r["publicEnabled"]!==false || $r["schemaVersions"]!==[1,2,3,4] || $r["legacyPreserved"]!==true || $r["integrityVerified"]!==true || $r["idempotent"]!==true) exit(1); echo json_encode(["status"=>$r["status"],"schemaVersions"=>$r["schemaVersions"],"counts"=>$r["counts"],"legacyPreserved"=>true,"integrityVerified"=>true,"idempotent"=>true,"publicEnabled"=>false,"sourceMigrated"=>false],JSON_THROW_ON_ERROR|JSON_PRETTY_PRINT),PHP_EOL;' "$stage/result.json"
          echo "Private staging rehearsal completed; no production migration or code deployment."
          REMOTE
