# Mobile CI for apps/mobile (task P00-06 / MHD-001; QA rules in P00-09).
# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  secrets-and-policy:
    name: Secrets & policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan full git history for secrets
        run: ./gitleaks git . --redact --no-banner --verbose

      - name: Product policy checks (no ads/tracking, permissions, pins)
        working-directory: apps/mobile
        run: ./tool/policy_checks.sh

      - name: Verify brand source assets and native icons
        run: python3 design/brand/check_assets.py

      - name: Verify RLS architecture blueprint (static contract only)
        run: python3 docs/architecture/check_schema_contract.py

      - name: Validate AR/EN wireframe SVG sources
        run: python3 docs/ux/check_wireframes.py

      - name: Validate prayer reference and timezone data
        run: python3 docs/prayer/check_reference_fixtures.py

      - name: Lint and test the hosted admin (PHP)
        run: |
          for file in hosting/admin/*.php hosting/prophet-stories/*.php hosting/tests/*.php; do
            php -l "$file"
          done
          php hosting/tests/apk_signature_test.php

  quran-edge:
    name: Quran Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting and endpoint contracts
        run: |
          npx --yes deno@2.9.6 fmt --check supabase/functions/quran
          npx --yes deno@2.9.6 test --allow-env supabase/functions/quran/handler_test.ts

  analyze-test:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/core/localization/generated

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Test worship and the reader with signed Dev feature flags
        run: |
          flutter test --dart-define=MADAR_FEATURE_PREVIEW=false \
            --dart-define=MADAR_MANAGED_RELEASE=true \
            test/app/navigation_test.dart test/app/startup_splash_test.dart \
            test/features/worship/adhkar_screens_test.dart \
            test/features/worship/daily_reading_test.dart \
            test/features/hadith/hadith_screen_test.dart \
            test/features/quran/offline_recitations_test.dart

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: apps/mobile/coverage/lcov.info
          retention-days: 14

  build-android:
    name: Android debug build
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        env:
          MADAR_QURAN_API_URL: ${{ vars.MADAR_QURAN_API_URL }}
          MADAR_SUPABASE_ANON_KEY: ${{ vars.MADAR_SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$MADAR_QURAN_API_URL" && -z "$MADAR_SUPABASE_ANON_KEY" ]]; then
            flutter build apk --debug
            exit
          fi
          config="$RUNNER_TEMP/madar-public-config.json"
          python3 tool/write_quran_config.py "$config"
          MADAR_CHANNEL=preview flutter build apk --debug --dart-define-from-file="$config"

      - name: Record APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: madar-al-huda-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
